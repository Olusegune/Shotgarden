<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shotgarden</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body {
        display: grid;
        place-items: center;
        color: #f5f7f3;
        font-family: Inter, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at 50% 20%, rgba(190,255,43,.13), transparent 35%),
          linear-gradient(145deg, #17191c 0%, #090a0c 72%);
        border: 1px solid rgba(255,255,255,.12);
      }
      body::before {
        content: "";
        position: absolute;
        inset: 0;
        opacity: .12;
        background-image: radial-gradient(rgba(255,255,255,.65) .6px, transparent .6px);
        background-size: 13px 13px;
        mask-image: linear-gradient(to bottom, #000, transparent 80%);
      }
      main { position: relative; display: grid; justify-items: center; gap: 16px; }
      img { width: 156px; height: 156px; object-fit: contain; filter: drop-shadow(0 20px 32px rgba(0,0,0,.55)); }
      h1 { margin: 0; font-size: 29px; line-height: 1; letter-spacing: .24em; text-transform: uppercase; }
      p { margin: 0; color: #969b93; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; }
      .loader { width: 180px; height: 2px; margin-top: 12px; overflow: hidden; background: rgba(255,255,255,.08); }
      .loader::after {
        content: "";
        display: block;
        width: 45%;
        height: 100%;
        background: #baff27;
        box-shadow: 0 0 14px rgba(186,255,39,.75);
        animation: load 1.15s ease-in-out infinite;
      }
      @keyframes load { from { transform: translateX(-110%); } to { transform: translateX(330%); } }
    </style>
  </head>
  <body>
    <main>
      <img src="assets/shotgarden-app.png" alt="" />
      <h1>Shotgarden</h1>
      <p>Growing cinematic worlds</p>
      <div class="loader" aria-label="Starting Shotgarden"></div>
    </main>
  </body>
</html>
